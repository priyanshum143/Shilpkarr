    <script>
      (function () {
        var grid = document.getElementById('render-work-grid');
        if (!grid || typeof RENDER_PROJECTS === 'undefined') return;

        RENDER_PROJECTS.forEach(function (p) {
          var cover = p.images && p.images[0] ? p.images[0] : '';
          if (!cover) return;
          var src = renderProjectImageUrl(p.folder, cover);
          var tagAll = (p.tag || '').replace(/"/g, '&quot;');

          var a = document.createElement('a');
          a.className = 'work-card work-card--link';
          a.href = 'project.html?p=' + encodeURIComponent(p.slug);
          a.innerHTML =
            '<div class="work-card-image"><img src="' +
            src +
            '" alt="" loading="lazy" decoding="async" width="400" height="300"></div>' +
            '<div class="work-card-content"><span class="work-card-tag" data-tag-all="' +
            tagAll +
            '">' +
            (p.tag || '').replace(/</g, '') +
            '</span><h3 class="work-card-title">' +
            (p.title || '').replace(/</g, '') +
            '</h3><p class="work-card-desc">' +
            (p.shortDescription || '').replace(/</g, '') +
            '</p><span class="work-card-cta">View project →</span></div>';
          grid.appendChild(a);
        });
      })();
    </script>
