    <script src="../js/main.js" defer></script>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var slug = params.get('p');
        var project = typeof getRenderProjectBySlug === 'function' ? getRenderProjectBySlug(slug) : null;
        var titleEl = document.getElementById('render-project-title');
        var tagEl = document.getElementById('render-project-tag');
        var descEl = document.getElementById('render-project-description');
        var galleryEl = document.getElementById('render-project-gallery');

        if (!project) {
          document.title = 'Project not found — Shilpkarr';
          if (titleEl) titleEl.textContent = 'Project not found';
          if (tagEl) tagEl.textContent = '';
          if (descEl) {
            descEl.innerHTML = '<p>This project link may be outdated. <a href="index.html">Back to our work</a></p>';
          }
          if (galleryEl) galleryEl.innerHTML = '';
          return;
        }

        document.title = project.title + ' — Shilpkarr | Work';
        if (titleEl) titleEl.textContent = project.title;
        if (tagEl) tagEl.textContent = project.tag || '';
        if (descEl) {
          var paras = (project.description || '').split(/\n\n+/).filter(Boolean);
          descEl.innerHTML = paras.map(function (t) { return '<p>' + t.replace(/</g, '&lt;') + '</p>'; }).join('');
        }

        if (galleryEl && project.images && project.images.length) {
          project.images.forEach(function (file, idx) {
            var fig = document.createElement('figure');
            fig.className = 'project-gallery-item';
            var img = document.createElement('img');
            img.src = renderProjectImageUrl(project.folder, file);
            img.alt = (project.title || '') + ' — ' + (idx + 1);
            img.loading = idx === 0 ? 'eager' : 'lazy';
            img.decoding = 'async';
            img.width = 900;
            img.height = 675;
            fig.appendChild(img);
            galleryEl.appendChild(fig);
          });
        }
      })();
    </script>
